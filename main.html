<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CAVE // Cronos Terminal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #060609;
      --card-bg: #0e0e14;
      --border: #1f1f2e;
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --green: #22c55e;
      --text-muted: #8e8ea0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: #fafafa;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top navigation bar */
    header {
      background: rgba(14, 14, 20, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px clamp(16px, 4vw, 28px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: clamp(1rem, 3vw, 1.25rem);
      letter-spacing: 0.08em;
      color: #ffffff;
    }

    .brand-logo span {
      color: var(--accent);
    }

    .badge-chain {
      background: rgba(0, 134, 255, 0.12);
      border: 1px solid rgba(0, 134, 255, 0.35);
      color: #38bdf8;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      display: inline-block;
    }

    .back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-btn:hover {
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Main Terminal Layout */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: clamp(14px, 3vw, 24px);
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      gap: 14px;
    }

    /* Pair Controls & Preset Buttons */
    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
    }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .pair-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 260px;
    }

    .pair-input {
      background: #050508;
      border: 1px solid var(--border);
      color: #f4f4f5;
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.75rem, 2vw, 0.85rem);
      padding: 9px 12px;
      border-radius: 8px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    .pair-input:focus {
      border-color: var(--accent);
    }

    .load-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .load-btn:hover {
      opacity: 0.9;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--green);
      font-family: 'JetBrains Mono', monospace;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Presets Quick Picker */
    .presets-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.8rem;
    }

    .presets-label {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .preset-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: #e4e4e7;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-pill:hover, .preset-pill.active {
      background: rgba(168, 85, 247, 0.15);
      border-color: var(--accent);
      color: #fff;
    }

    /* Dexscreener Terminal Frame */
    .terminal-frame {
      position: relative;
      flex: 1;
      height: calc(100vh - 210px);
      min-height: 580px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    #dexIframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">CAVE <span>//</span> TERMINAL</div>
      <div class="badge-chain">Cronos</div>
    </div>
    
    <div>
      <a href="index.html" class="back-btn">
        ← Back
      </a>
    </div>
  </header>

  <!-- Terminal Main -->
  <main>
    <div class="controls-container">
      <div class="top-controls">
        <div class="pair-picker">
          <input 
            type="text" 
            id="pairInput" 
            class="pair-input" 
            placeholder="Paste Cronos Pair Address (0x...)" 
            value="0xe61db569e231b3f5530168aa2c9d50246525b6d6"
          />
          <button class="load-btn" onclick="updatePair()">Load</button>
        </div>

        <div class="live-status">
          <span class="status-dot"></span>
          FEED LIVE
        </div>
      </div>

      <!-- Quick Test Buttons -->
      <div class="presets-row">
        <span class="presets-label">Test Pairs:</span>
        <button class="preset-pill active" onclick="loadPreset('0xe61db569e231b3f5530168aa2c9d50246525b6d6', this)">WCRO / USDC</button>
        <button class="preset-pill" onclick="loadPreset('0xbf62c67ea509e86f07c8c69d0286c0636c50270b', this)">VVS / WCRO</button>
        <button class="preset-pill" onclick="loadPreset('0x553255ff6e6545eb5b01449c253b27b68b7ca2c1', this)">CORGIAI / WCRO</button>
      </div>
    </div>

    <!-- Dexscreener Live Embed -->
    <div class="terminal-frame">
      <iframe 
        id="dexIframe"
        src="https://dexscreener.com/cronos/0xe61db569e231b3f5530168aa2c9d50246525b6d6?embed=1&theme=dark&trades=0&info=0"
        title="DEXScreener Cronos Terminal"
        allowfullscreen>
      </iframe>
    </div>
  </main>

  <footer>
    welcome to cave • powered by cronos network
  </footer>

  <script>
    function updatePair() {
      const input = document.getElementById('pairInput').value.trim();
      const iframe = document.getElementById('dexIframe');
      
      if (input) {
        // Automatically strips full URLs if the user pasted a raw web link
        let cleanId = input.replace('https://dexscreener.com/cronos/', '').replace(/\?.*$/, '');
        iframe.src = `https://dexscreener.com/cronos/${cleanId}?embed=1&theme=dark&trades=0&info=0`;
      }
    }

    function loadPreset(address, btnElement) {
      document.getElementById('pairInput').value = address;
      updatePair();

      // Highlight active button
      document.querySelectorAll('.preset-pill').forEach(el => el.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
    }

    // Allow pressing "Enter" in the input field
    document.getElementById('pairInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        updatePair();
      }
    });
  </script>
</body>
</html>
