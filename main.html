<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CAVE // Cronos Terminal</title>
  
  <!-- Typography: JetBrains Mono for telemetry/finance data, Plus Jakarta Sans for executive UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050508;
      --card-bg: #0b0b12;
      --card-sub: #0f0f18;
      --border: #1b1b2a;
      --border-focus: #7c3aed;
      --accent: #a855f7;
      --accent-bright: #c084fc;
      --accent-glow: rgba(168, 85, 247, 0.35);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.4);
      --text: #f4f4f8;
      --text-muted: #82829b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden; /* Strict zero-scroll guarantee across viewports */
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Ambient Terminal Glow Background */
    .ambient-radial {
      position: fixed;
      top: -10%;
      right: 10%;
      width: 50vw;
      height: 35vh;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, rgba(5, 5, 8, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      background: rgba(11, 11, 18, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      z-index: 20;
      backdrop-filter: blur(16px);
      gap: 12px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      color: #fff;
    }

    .brand-badge span {
      color: var(--accent);
    }

    .chain-tag {
      background: rgba(0, 134, 255, 0.12);
      border: 1px solid rgba(0, 134, 255, 0.35);
      color: #38bdf8;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green-glow);
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'JetBrains Mono', monospace;
    }

    .action-btn:hover {
      color: #fff;
      border-color: var(--accent);
      background: rgba(168, 85, 247, 0.1);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .command-deck {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .deck-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .token-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .token-img-wrapper {
      position: relative;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .token-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--accent);
      background: #11111a;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .verified-icon {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 13px;
      height: 13px;
      background: #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 8px;
      font-weight: 900;
      border: 1.5px solid var(--card-bg);
    }

    .token-headings {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .token-headline {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .token-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
    }

    .token-ticker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-bright);
    }

    .address-copy-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--card-sub);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .address-copy-chip:hover {
      border-color: var(--accent);
      color: #fff;
    }

    .telemetry-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat-chip {
      background: var(--card-sub);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 9px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
    }

    .stat-label {
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.65rem;
    }

    .stat-val {
      font-weight: 700;
      color: #fff;
    }

    .stat-val.positive {
      color: var(--green);
    }

    .deck-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-input-group {
      display: flex;
      align-items: center;
      background: #06060a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 4px 3px 10px;
      gap: 8px;
      flex: 1;
      max-width: 520px;
      min-width: 250px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input-group:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .search-icon {
      color: var(--text-muted);
      display: flex;
    }

    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      width: 100%;
    }

    .search-input::placeholder {
      color: #4b4b60;
    }

    .execute-btn {
      background: linear-gradient(135deg, #9333ea, #7c3aed);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      transition: opacity 0.2s ease, transform 0.15s ease;
      white-space: nowrap;
    }

    .execute-btn:hover {
      opacity: 0.92;
      transform: scale(1.02);
    }

    .preset-group {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .preset-group::-webkit-scrollbar {
      display: none;
    }

    .preset-tag {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .preset-tag:hover {
      border-color: var(--accent);
      color: #fff;
    }

    .preset-tag.active {
      background: rgba(168, 85, 247, 0.15);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
    }

    .terminal-stage {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      background: #000;
      overflow: hidden;
    }

    .chart-skeleton {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050508;
      z-index: 1;
      gap: 12px;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .chart-skeleton.hidden {
      opacity: 0;
    }

    .skeleton-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(168, 85, 247, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .skeleton-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    #dexIframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 2;
    }

    footer {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
      position: relative;
      z-index: 20;
      overflow-x: auto;
      scrollbar-width: none;
    }

    footer::-webkit-scrollbar {
      display: none;
    }

    .ecosystem-tray {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .tray-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-right: 4px;
      white-space: nowrap;
    }

    .eco-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--card-sub);
      border: 1px solid var(--border);
      color: #cbd5e1;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .eco-pill:hover {
      border-color: var(--accent);
      color: #fff;
      background: rgba(168, 85, 247, 0.12);
      transform: translateY(-1px);
    }

    .pill-icon {
      width: 13px;
      height: 13px;
      display: inline-flex;
      color: var(--accent);
      flex-shrink: 0;
    }

    .pill-icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .legal-chip {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      display: none;
    }

    @media (min-width: 900px) {
      .legal-chip { display: block; }
    }
  </style>
</head>
<body>

  <!-- Ambient lighting layer -->
  <div class="ambient-radial"></div>

  <header>
    <div class="brand-section">
      <div class="brand-badge">
        CAVE <span>//</span> TERMINAL
      </div>
      <div class="chain-tag">
        <span class="live-dot"></span>
        Cronos Mainnet
      </div>
    </div>

    <div class="header-nav">
      <a href="https://dexscreener.com/cronos/0x9e44225db6a7c0d31f081d9ffa658979b8e523db" 
         id="externalDexBtn" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="action-btn" 
         title="Open full chart directly in DexScreener">
        <span>DexScreener</span>
        <span style="font-size: 0.7rem;">↗</span>
      </a>
      <a href="index.html" class="action-btn" title="Return to splash">
        ← Splash
      </a>

  </header>

  <div class="command-deck">
    <!-- Row 1: Token Persona & Live Metrics -->
    <div class="deck-top">
      <div class="token-profile">
        <div class="token-img-wrapper">
          <img 
            id="tokenAvatar" 
            class="token-avatar" 
            src="https://api.dicebear.com/7.x/bottts/svg?seed=cronus"

            onerror="this.src='https://api.dicebear.com/7.x/identicon/svg?seed=cronus'"

        <div class="token-headings">

            <span id="tokenTicker" class="token-ticker">$CRONUS</span>
          </div>
          <div class="address-copy-chip" onclick="copyActivePairAddress()" title="Click to copy pair address">
            <span>Pair:</span>
            <span id="pairDisplay">0x9e44...23db</span>
            <span id="copyFeedback" style="color: var(--accent);">📋</span>
          </div>

      </div>

      <!-- Live Web3 telemetry data metrics -->
      <div class="telemetry-row">
        <div class="stat-chip">
          <span class="stat-label">Feed</span>
          <span class="stat-val positive">WebSocket Live</span>
        </div>
        <div class="stat-chip">
          <span class="stat-label">Network Gas</span>
          <span class="stat-val">5,000 Gwei</span>
        </div>
        <div class="stat-chip">
          <span class="stat-label">Avg Block</span>
          <span class="stat-val">5.4s</span>
        </div>
      </div>
    </div>

    <!-- Row 2: Search Input & Quick Select Presets -->
    <div class="deck-bottom">
      <div class="search-input-group">
        <div class="search-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <input 
          type="text" 
          id="pairInput" 
          class="search-input" 
          placeholder="Paste Cronos Pair Address (0x...)" 
          value="0x9e44225db6a7c0d31f081d9ffa658979b8e523db"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="execute-btn" onclick="executePairLoad()">Load</button>
      </div>

      <div class="preset-group">
        <button 
          class="preset-tag active" 
          onclick="applyPreset('0x9e44225db6a7c0d31f081d9ffa658979b8e523db', 'Cronus Meme', '$CRONUS', 'https://api.dicebear.com/7.x/bottts/svg?seed=cronus', this)">
          ⚡ $CRONUS
        </button>
        <button 
          class="preset-tag" 
          onclick="applyPreset('0xe61db569e231b3f5530168aa2c9d50246525b6d6', 'Cave Benchmark', '$CAVE', 'https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?w=100&h=100&fit=crop&crop=faces', this)">
          🦍 $CAVE
        </button>
        <button 
          class="preset-tag" 
          onclick="applyPreset('0x553255ff6e6545eb5b01449c253b27b68b7ca2c1', 'CorgiAI', '$CORGI', 'https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=100&h=100&fit=crop', this)">
          🐕 $CORGI
        </button>
        <button 
          class="preset-tag" 
          onclick="applyPreset('0xbf62c67ea509e86f07c8c69d0286c0636c50270b', 'VVS Finance', '$VVS', 'https://api.dicebear.com/7.x/identicon/svg?seed=vvs', this)">
          💎 $VVS
        </button>
        <button 
          class="preset-tag" 
          onclick="applyPreset('0xe61db569e231b3f5530168aa2c9d50246525b6d6', 'WCRO / USDC', 'WCRO', 'https://api.dicebear.com/7.x/shapes/svg?seed=cro', this)">
          🔷 WCRO/USDC
        </button>
      </div>
    </div>
  </div>

  <main class="terminal-stage">
    <!-- Chart loading skeleton -->
    <div id="chartSkeleton" class="chart-skeleton">
      <div class="skeleton-spinner"></div>
      <div class="skeleton-text">Synchronizing DEX Candles...</div>
    </div>

    <!-- DexScreener Live Frame with mobile-safe permissions -->
    <iframe 
      id="dexIframe"
      src="https://dexscreener.com/cronos/0x9e44225db6a7c0d31f081d9ffa658979b8e523db?embed=1&theme=dark"
      title="Live Cronos Terminal Chart"
      allow="clipboard-write; web-share"
      sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
      allowfullscreen
      onload="dismissSkeleton()">
    </iframe>
  </main>

  <footer>
    <div class="ecosystem-tray">
      <span class="tray-title">Ecosystem:</span>

      <!-- 1. Cronos Official Core Hub -->

        </span>
        Cronos.org
      </a>

      <!-- 2. Block Explorer: Cronoscan -->

          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>

        Cronoscan

          <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>

          <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>

        DexScreener

      <a href="https://defillama.com/chain/Cronos" target="_blank" rel="noopener noreferrer" class="eco-pill" title="DeFiLlama Cronos Metrics">
        <span class="pill-icon">
          <svg viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
        </span>
        DeFiLlama

      <!-- 6. NFT Marketplace: Ebisu's Bay -->
      <a href="https://ebisusbay.com" target="_blank" rel="noopener noreferrer" class="eco-pill" title="Ebisu's Bay NFT Marketplace">
        <span class="pill-icon">
          <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        </span>
        Ebisu's Bay
      </a>
    </div>

    <div class="legal-chip">
      CAVE Protocol • Cronos Network
    </div>
  </footer>

  <script>
    let activePairAddress = "0x9e44225db6a7c0d31f081d9ffa658979b8e523db";

    function dismissSkeleton() {
      const skeleton = document.getElementById('chartSkeleton');
      if (skeleton) {
        skeleton.classList.add('hidden');
      }
    }

    function executePairLoad() {
      const input = document.getElementById('pairInput').value.trim();
      const iframe = document.getElementById('dexIframe');
      const skeleton = document.getElementById('chartSkeleton');
      const extBtn = document.getElementById('externalDexBtn');

      if (!input) return;

      // Extract raw hash even if the user accidentally pasted a full web URL
      let cleanAddress = input.replace('https://dexscreener.com/cronos/', '').replace(/\?.*$/, '').trim();
      activePairAddress = cleanAddress;

      // Show loading skeleton while chart reloads
      if (skeleton) skeleton.classList.remove('hidden');

      const targetUrl = `https://dexscreener.com/cronos/${cleanAddress}?embed=1&theme=dark`;
      iframe.src = targetUrl;
      
      if (extBtn) {
        extBtn.href = `https://dexscreener.com/cronos/${cleanAddress}`;
      }

      // Format short address string
      const shortAddr = cleanAddress.length > 10 
        ? `${cleanAddress.substring(0, 6)}...${cleanAddress.substring(cleanAddress.length - 4)}` 
        : cleanAddress;
      document.getElementById('pairDisplay').innerText = shortAddr;
    }

    function applyPreset(address, name, ticker, avatarSrc, btnElement) {
      document.getElementById('pairInput').value = address;
      document.getElementById('tokenTitle').innerText = name;
      document.getElementById('tokenTicker').innerText = ticker;
      document.getElementById('tokenAvatar').src = avatarSrc;

      executePairLoad();

      // Highlight active preset button
      document.querySelectorAll('.preset-tag').forEach(tag => tag.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
    }

    function copyActivePairAddress() {
      if (!activePairAddress) return;

      const fallbackCopy = (text) => {
        const temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
      };

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(activePairAddress);
        } else {
          fallbackCopy(activePairAddress);
        }
      } catch (err) {
        fallbackCopy(activePairAddress);
      }

      // Visual feedback
      const feedback = document.getElementById('copyFeedback');
      feedback.innerText = "COPIED! ✓";
      feedback.style.color = "#10b981";
      setTimeout(() => {
        feedback.innerText = "📋";
        feedback.style.color = "var(--accent)";
      }, 1500);
    }

    // Submit on Enter key inside search bar
    document.getElementById('pairInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        executePairLoad();
      }
    });

    // Auto-dismiss skeleton safety timer in case iframe onLoad is cached
    setTimeout(dismissSkeleton, 2000);
  </script>
</body>
</html>
