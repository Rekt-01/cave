<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CRONUS // Terminal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050508;
      --card: #0d0d13;
      --border: #1a1a28;
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --green: #22c55e;
      --text-muted: #8b8b9e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden; /* Zero scroll */
      background-color: var(--bg);
      color: #fafafa;
      font-family: 'Inter', sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* 1. Slim Top Bar */
    header {
      background: rgba(13, 13, 19, 0.98);
      border-bottom: 1px solid var(--border);
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 10px;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .token-pic {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--accent);
      background: #111;
    }

    .token-titles {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .token-symbol {
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    .token-chain-badge {
      font-size: 0.65rem;
      font-family: 'JetBrains Mono', monospace;
      color: #38bdf8;
      background: rgba(0, 134, 255, 0.12);
      border: 1px solid rgba(0, 134, 255, 0.3);
      padding: 1px 6px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .ca-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }

    .ca-pill:hover {
      color: #fff;
      border-color: var(--accent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      color: #fff;
      border-color: var(--accent);
    }

    /* 2. Compact Control & Quick Links Ribbon */
    .utility-strip {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 5px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: nowrap;
      overflow-x: auto;
    }

    .utility-strip::-webkit-scrollbar {
      display: none;
    }

    /* Links group */
    .links-bar {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .eco-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #06060a;
      border: 1px solid var(--border);
      color: #cbd5e1;
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 0.7rem;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .eco-chip:hover {
      border-color: var(--accent);
      color: #fff;
      background: rgba(168, 85, 247, 0.15);
    }

    .eco-chip svg {
      width: 12px;
      height: 12px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
    }

    .pair-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .pair-input-mini {
      background: #050508;
      border: 1px solid var(--border);
      color: #f4f4f5;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: 5px;
      width: 130px;
      outline: none;
    }

    .pair-input-mini:focus {
      border-color: var(--accent);
      width: 180px;
    }

    .load-btn-mini {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 4px 9px;
      border-radius: 5px;
      font-weight: 600;
      font-size: 0.7rem;
      cursor: pointer;
    }

    /* 3. Terminal Chart Container (Fills exact remaining space) */
    .terminal-container {
      position: relative;
      flex: 1 1 0;
      min-height: 0; /* Prevents flex overflow */
      width: 100%;
      background: #000;
    }

    #dexIframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- 1. Header with Token Profile & CA -->
  <header>
    <div class="brand-cluster">
      <!-- Cronus Meme Token Icon -->
      <img 
        id="tokenImage" 
        class="token-pic" 
        src="https://api.dicebear.com/7.x/bottts/svg?seed=cronus" 
        alt="CRONUS" 
      />
      
      <div class="token-titles">
        <span class="token-symbol">Cronus Meme <span style="color: var(--accent);">$CRONUS</span></span>
        <span class="token-chain-badge">Cronos</span>
      </div>

      <div class="ca-pill" onclick="copyCA()" title="Click to copy Pair Address">
        <span id="caLabel">0x9e44...23db</span> 📋
      </div>
    </div>

    <div class="header-actions">
      <a href="https://dexscreener.com/cronos/0x9e44225db6a7c0d31f081d9ffa658979b8e523db" target="_blank" rel="noopener noreferrer" class="nav-btn" id="appLink">
        DexScreener ↗
      </a>
      <a href="index.html" class="nav-btn">← Splash</a>
    </div>
  </header>

  <!-- 2. Single-line Toolbar with Ecosystem Sites & Pair Input -->
  <div class="utility-strip">
    <!-- Links with icons fit neatly on top -->
    <div class="links-bar">
      <a href="https://cronos.org" target="_blank" rel="noopener noreferrer" class="eco-chip" title="Cronos Official">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
        Cronos.org
      </a>
      <a href="https://cronoscan.com" target="_blank" rel="noopener noreferrer" class="eco-chip" title="Cronoscan">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Cronoscan
      </a>
      <a href="https://vvs.finance" target="_blank" rel="noopener noreferrer" class="eco-chip" title="VVS DEX">
        <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/></svg>
        VVS Finance
      </a>
      <a href="https://defillama.com/chain/Cronos" target="_blank" rel="noopener noreferrer" class="eco-chip" title="DeFiLlama">
        <svg viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/></svg>
        DeFiLlama
      </a>
      <a href="https://ebisusbay.com" target="_blank" rel="noopener noreferrer" class="eco-chip" title="Ebisu's Bay NFT">
        <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/></svg>
        Ebisu's Bay
      </a>
    </div>

    <!-- Quick Switcher -->
    <div class="pair-tools">
      <input 
        type="text" 
        id="pairInput" 
        class="pair-input-mini" 
        placeholder="Switch 0x..." 
        value="0x9e44225db6a7c0d31f081d9ffa658979b8e523db"
      />
      <button class="load-btn-mini" onclick="updatePair()">Load</button>
    </div>
  </div>

  <!-- 3. Chart Fills 100% of the Remainder without Scrolling -->
  <div class="terminal-container">
    <iframe 
      id="dexIframe"
      src="https://dexscreener.com/cronos/0x9e44225db6a7c0d31f081d9ffa658979b8e523db?embed=1&theme=dark"
      title="Cronus Meme DEX Screener"
      allow="clipboard-write; web-share"
      sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    let activePair = "0x9e44225db6a7c0d31f081d9ffa658979b8e523db";

    function updatePair() {
      const input = document.getElementById('pairInput').value.trim();
      const iframe = document.getElementById('dexIframe');
      const appLink = document.getElementById('appLink');

      if (input) {
        let clean = input.replace('https://dexscreener.com/cronos/', '').replace(/\?.*$/, '');
        activePair = clean;
        iframe.src = `https://dexscreener.com/cronos/${clean}?embed=1&theme=dark`;
        if (appLink) appLink.href = `https://dexscreener.com/cronos/${clean}`;

        const short = clean.length > 10 ? `${clean.substring(0, 6)}...${clean.substring(clean.length - 4)}` : clean;
        document.getElementById('caLabel').innerText = short;
      }
    }

    function copyCA() {
      navigator.clipboard.writeText(activePair);
      const label = document.getElementById('caLabel');
      const prev = label.innerText;
      label.innerText = "COPIED! ✓";
      setTimeout(() => { label.innerText = prev; }, 1400);
    }

    document.getElementById('pairInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') updatePair();
    });
  </script>
</body>
</html>
