<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>welcome to cave</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050508;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.4s ease;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 900px;
      padding: 20px;
    }

    /* Pen Cursive Canvas */
    #caveCanvas {
      width: 100%;
      max-width: 820px;
      height: 160px;
      display: block;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.4))
              drop-shadow(0 0 24px rgba(168, 85, 247, 0.35));
    }

    /* Click to Ape Button */
    .btn-container {
      margin-top: 50px;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      pointer-events: none;
    }

    .btn-container.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .ape-btn {
      background: #09090d;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 16px 44px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      outline: none;
    }

    .ape-btn:hover {
      border-color: #a855f7;
      box-shadow: 0 0 28px rgba(168, 85, 247, 0.55);
      transform: scale(1.05);
    }

    .ape-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Real-time stroke handwriting canvas -->
    <canvas id="caveCanvas" width="1640" height="320"></canvas>

    <div class="btn-container" id="btnContainer">
      <button class="ape-btn" id="apeButton" onclick="handleApe()">
        Click to Ape 🦍
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('caveCanvas');
    const ctx = canvas.getContext('2d');
    const btnContainer = document.getElementById('btnContainer');

    // Wait for the script font to load so it renders cleanly
    const font = new FontFace('CreatineHandwriting', 'url(https://fonts.gstatic.com/s/greatvibes/v19/RWmMoKWR9v4ksMfaWd_JN-XCg6UK.woff2)');

    font.load().then(function(loadedFont) {
      document.fonts.add(loadedFont);
      startWriting();
    }).catch(function() {
      // Fallback font if network fails
      startWriting();
    });

    function startWriting() {
      const fullText = "welcome to cave";
      const totalDuration = 3200; // 3.2 seconds
      const startTime = performance.now();

      function frame(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / totalDuration, 1);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Styling
        ctx.font = "italic 130px 'CreatineHandwriting', cursive, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const textX = canvas.width / 2;
        const textY = canvas.height / 2;
        const textWidth = ctx.measureText(fullText).width;
        const startX = textX - (textWidth / 2) - 20;

        // Clip region that expands from left to right like a pen moving
        ctx.save();
        ctx.beginPath();
        const currentClipWidth = (textWidth + 60) * progress;
        ctx.rect(startX, 0, currentClipWidth, canvas.height);
        ctx.clip();

        // Stroke pen path
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3.5;
        ctx.strokeText(fullText, textX, textY);

        // Subtle fill glow
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.fillText(fullText, textX, textY);

        ctx.restore();

        // Pen tip light point
        if (progress < 1) {
          const penX = startX + currentClipWidth;
          ctx.beginPath();
          ctx.arc(penX, textY + 8, 4, 0, Math.PI * 2);
          ctx.fillStyle = "#e9d5ff";
          ctx.shadowColor = "#a855f7";
          ctx.shadowBlur = 10;
          ctx.fill();
        }

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          // Reveal the Ape button after finishing
          btnContainer.classList.add('show');
        }
      }

      requestAnimationFrame(frame);
    }

    function handleApe() {
      const btn = document.getElementById('apeButton');
      btn.innerText = 'Aping In... 🚀';
      btn.style.borderColor = '#22c55e';
      btn.style.boxShadow = '0 0 35px rgba(34, 197, 94, 0.7)';
      btn.style.pointerEvents = 'none';

      setTimeout(() => {
        document.body.style.opacity = '0';
        setTimeout(() => {
          window.location.href = 'main.html';
        }, 300);
      }, 400);
    }
  </script>
</body>
</html>
