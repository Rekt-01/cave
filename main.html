<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAVE // Cronos Terminal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07070a;
      --card-bg: #0e0e14;
      --border: #1f1f2e;
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.35);
      --green: #22c55e;
      --text-muted: #8e8ea0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: #fafafa;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header Nav */
    header {
      background: rgba(14, 14, 20, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-logo span {
      color: var(--accent);
    }

    .badge-chain {
      background: rgba(0, 134, 255, 0.12);
      border: 1px solid rgba(0, 134, 255, 0.35);
      color: #38bdf8;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .back-btn:hover {
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Main Terminal Layout */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 18px 24px 24px 24px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      gap: 16px;
    }

    /* Pair address switch bar */
    .terminal-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
    }

    .pair-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      max-width: 600px;
    }

    .pair-input {
      background: #050508;
      border: 1px solid var(--border);
      color: #f4f4f5;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      padding: 8px 12px;
      border-radius: 8px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    .pair-input:focus {
      border-color: var(--accent);
    }

    .load-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .load-btn:hover {
      opacity: 0.9;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--green);
      font-family: 'JetBrains Mono', monospace;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Dexscreener Terminal Frame */
    .terminal-frame {
      position: relative;
      flex: 1;
      min-height: 720px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    #dexIframe {
      width: 100%;
      height: 100%;
      border: none;
      min-height: 720px;
      display: block;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 14px;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
