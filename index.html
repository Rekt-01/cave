<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>welcome to CAVE</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #040407;
      --accent: #a855f7;
      --accent-bright: #c084fc;
      --green: #22c55e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: #ffffff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: opacity 0.35s ease, filter 0.35s ease;
      position: relative;
      padding: 24px 16px;
    }

    /* Ambient lighting */
    .ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(90vw, 650px);
      height: min(65vw, 420px);
      background: radial-gradient(ellipse at center, rgba(168, 85, 247, 0.16) 0%, rgba(99, 102, 241, 0.08) 45%, rgba(4, 4, 7, 0) 75%);
      pointer-events: none;
      z-index: 0;
      filter: blur(24px);
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 900px;
    }

    /* Subtle top badge */
    .network-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.68rem, 2vw, 0.78rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: clamp(18px, 4vh, 32px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .network-badge .dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
    }

    /* Canvas stage container: perfectly locked aspect ratio */
    .canvas-box {
      width: 100%;
      max-width: 840px;
      aspect-ratio: 16 / 4.8;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 580px) {
      .canvas-box {
        aspect-ratio: 16 / 5.8;
      }
    }

    #cursiveCanvas {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 14px rgba(168, 85, 247, 0.32));
    }

    /* Button wrapper */
    .btn-container {
      margin-top: clamp(28px, 5vh, 48px);
      opacity: 0;
      transform: translateY(14px) scale(0.98);
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .btn-container.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* Executive CTA button */
    .enter-btn {
      position: relative;
      background: linear-gradient(135deg, rgba(24, 24, 34, 0.95), rgba(10, 10, 16, 0.95));
      color: #fafafa;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: clamp(13px, 3vw, 16px) clamp(32px, 6vw, 48px);
      font-size: clamp(0.9rem, 2.2vw, 1.05rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: 9999px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.7),
        inset 0 1px 1px rgba(255, 255, 255, 0.25),
        0 0 0 1px rgba(168, 85, 247, 0.1);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      outline: none;
    }

    .enter-btn .arrow-icon {
      font-size: 1rem;
      transition: transform 0.25s ease;
      color: var(--accent-bright);
    }

    .enter-btn:hover {
      border-color: var(--accent);
      box-shadow: 
        0 12px 35px rgba(0, 0, 0, 0.8),
        0 0 32px rgba(168, 85, 247, 0.55),
        inset 0 1px 1px rgba(255, 255, 255, 0.45);
      transform: translateY(-2px) scale(1.03);
      color: #ffffff;
    }

    .enter-btn:hover .arrow-icon {
      transform: translateX(4px);
    }

    .enter-btn:active {
      transform: translateY(1px) scale(0.98);
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="container">
    <div class="network-badge">
      <span class="dot"></span>
      <span>Cronos Network // System Ready</span>
    </div>

    <!-- Scaled aspect-ratio canvas -->
    <div class="canvas-box">
      <canvas id="cursiveCanvas"></canvas>
    </div>

    <div class="btn-container" id="btnContainer">
      <button class="enter-btn" id="enterBtn" onclick="handleEnter()">
        <span>Click to Enter</span>
        <span class="arrow-icon">→</span>
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('cursiveCanvas');
    const ctx = canvas.getContext('2d');
    const box = document.querySelector('.canvas-box');
    const btnContainer = document.getElementById('btnContainer');

    let logicalWidth = 1200;
    let logicalHeight = 360;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = box.getBoundingClientRect();
      
      logicalWidth = rect.width;
      logicalHeight = rect.height;

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;

      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Preload font and run
    document.fonts.load("italic 100px 'Great Vibes'").then(() => {
      runAnimation();
    }).catch(() => {
      runAnimation();
    });

    let animationComplete = false;

    function runAnimation() {
      const part1 = "welcome to ";
      const part2 = "CAVE";

      const time1 = 1200; // "welcome to "
      const time2 = 1000; // bold "CAVE"
      const totalTime = time1 + time2;
      const startTime = performance.now();

      function frame(now) {
        const elapsed = now - startTime;
        const progressTotal = Math.min(elapsed / totalTime, 1);

        ctx.clearRect(0, 0, logicalWidth, logicalHeight);

        // Dynamically scale font size based on current box width
        const scaleFactor = Math.min(logicalWidth / 800, 1.25);
        const fontSizeP1 = Math.max(48, Math.round(92 * scaleFactor));
        const fontSizeP2 = Math.max(56, Math.round(112 * scaleFactor));

        // Measure text accurately
        ctx.font = `italic 400 ${fontSizeP1}px 'Great Vibes', cursive`;
        const width1 = ctx.measureText(part1).width;

        ctx.font = `italic 700 ${fontSizeP2}px 'Great Vibes', cursive`;
        const width2 = ctx.measureText(part2).width;

        const totalWidth = width1 + width2;
        const startX = (logicalWidth - totalWidth) / 2;
        const baselineY = logicalHeight / 2 + (fontSizeP1 * 0.28);

        // 1. Draw "welcome to "
        const p1 = Math.min(elapsed / time1, 1);
        if (p1 > 0) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(startX - 10, 0, (width1 + 18) * p1, logicalHeight);
          ctx.clip();

          ctx.font = `italic 400 ${fontSizeP1}px 'Great Vibes', cursive, sans-serif`;
          ctx.textBaseline = "alphabetic";

          ctx.shadowColor = "rgba(168, 85, 247, 0.35)";
          ctx.shadowBlur = 10;

          ctx.strokeStyle = "rgba(226, 232, 240, 0.85)";
          ctx.lineWidth = Math.max(1.8, 2.2 * scaleFactor);
          ctx.strokeText(part1, startX, baselineY);

          ctx.fillStyle = "#f8fafc";
          ctx.fillText(part1, startX, baselineY);
          ctx.restore();
        }

        // 2. Draw "CAVE" (Bold glowing highlight)
        if (elapsed > time1) {
          const p2 = Math.min((elapsed - time1) / time2, 1);
          const caveX = startX + width1;

          ctx.save();
          ctx.beginPath();
          ctx.rect(caveX - 10, 0, (width2 + 30) * p2, logicalHeight);
          ctx.clip();

          ctx.font = `italic 700 ${fontSizeP2}px 'Great Vibes', cursive, sans-serif`;
          ctx.textBaseline = "alphabetic";

          // Neon highlight glow
          ctx.shadowColor = "#c084fc";
          ctx.shadowBlur = 22;

          ctx.strokeStyle = "#a855f7";
          ctx.lineWidth = Math.max(4.5, 5.5 * scaleFactor);
          ctx.strokeText(part2, caveX, baselineY);

          ctx.strokeStyle = "#e9d5ff";
          ctx.lineWidth = Math.max(2, 2.6 * scaleFactor);
          ctx.strokeText(part2, caveX, baselineY);

          // Silver-to-violet gradient
          const grad = ctx.createLinearGradient(caveX, baselineY - fontSizeP2 * 0.8, caveX, baselineY);
          grad.addColorStop(0, "#ffffff");
          grad.addColorStop(0.7, "#f5f3ff");
          grad.addColorStop(1, "#c084fc");
          ctx.fillStyle = grad;
          ctx.fillText(part2, caveX, baselineY);

          ctx.restore();
        }

        // 3. Realistic pen nib point
        if (progressTotal < 1) {
          let penX, penY, sparkColor;

          if (elapsed <= time1) {
            penX = startX + width1 * p1;
            penY = baselineY - (fontSizeP1 * 0.18) + Math.sin(p1 * 26) * (10 * scaleFactor);
            sparkColor = "#ffffff";
          } else {
            const p2 = (elapsed - time1) / time2;
            penX = startX + width1 + width2 * p2;
            penY = baselineY - (fontSizeP2 * 0.2) + Math.sin(p2 * 22) * (14 * scaleFactor);
            sparkColor = "#d8b4fe";
          }

          ctx.save();
          ctx.beginPath();
          ctx.arc(penX, penY, 5 * scaleFactor, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(168, 85, 247, 0.4)";
          ctx.fill();

          ctx.beginPath();
          ctx.arc(penX, penY, 2.5 * scaleFactor, 0, Math.PI * 2);
          ctx.fillStyle = sparkColor;
          ctx.shadowColor = "#a855f7";
          ctx.shadowBlur = 12;
          ctx.fill();
          ctx.restore();
        }

        if (progressTotal < 1) {
          requestAnimationFrame(frame);
        } else {
          animationComplete = true;
          btnContainer.classList.add('show');
        }
      }

      requestAnimationFrame(frame);
    }

    function handleEnter() {
      const btn = document.getElementById('enterBtn');
      btn.innerHTML = '<span>Entering Terminal</span> <span class="arrow-icon">✓</span>';
      btn.style.borderColor = '#22c55e';
      btn.style.boxShadow = '0 0 35px rgba(34, 197, 94, 0.65)';
      btn.style.pointerEvents = 'none';

      setTimeout(() => {
        document.body.style.opacity = '0';
        document.body.style.filter = 'blur(4px)';
        setTimeout(() => {
          window.location.href = 'main.html';
        }, 220);
      }, 260);
    }
  </script>
</body>
</html>
