<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>welcome to CAVE</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italianno&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #040407;
      --accent: #a855f7;
      --accent-bright: #c084fc;
      --green: #22c55e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: #ffffff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: opacity 0.35s ease, filter 0.35s ease;
      position: relative;
      padding: 24px 16px;
    }

    /* Ambient lighting */
    .ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(90vw, 650px);
      height: min(65vw, 420px);
      background: radial-gradient(ellipse at center, rgba(168, 85, 247, 0.16) 0%, rgba(99, 102, 241, 0.08) 45%, rgba(4, 4, 7, 0) 75%);
      pointer-events: none;
      z-index: 0;
      filter: blur(24px);
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 900px;
    }

    /* Top badge */
    .network-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.68rem, 2vw, 0.78rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: clamp(16px, 3vh, 28px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .network-badge .dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
    }

    /* Canvas stage */
    .canvas-box {
      width: 100%;
      max-width: 820px;
      aspect-ratio: 16 / 4.8;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 580px) {
      .canvas-box {
        aspect-ratio: 16 / 5.8;
      }
    }

    #cursiveCanvas {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.35));
    }

    /* Button wrapper */
    .btn-container {
      margin-top: clamp(28px, 5vh, 44px);
      opacity: 0;
      transform: translateY(14px) scale(0.98);
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .btn-container.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* Clean CTA button */
    .enter-btn {
      position: relative;
      background: linear-gradient(135deg, rgba(24, 24, 34, 0.95), rgba(10, 10, 16, 0.95));
      color: #fafafa;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: clamp(13px, 3vw, 16px) clamp(32px, 6vw, 48px);
      font-size: clamp(0.9rem, 2.2vw, 1.05rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: 9999px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.7),
        inset 0 1px 1px rgba(255, 255, 255, 0.25),
        0 0 0 1px rgba(168, 85, 247, 0.1);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      outline: none;
    }

    .enter-btn .arrow-icon {
      font-size: 1rem;
      transition: transform 0.25s ease;
      color: var(--accent-bright);
    }

    .enter-btn:hover {
      border-color: var(--accent);
      box-shadow: 
        0 12px 35px rgba(0, 0, 0, 0.8),
        0 0 32px rgba(168, 85, 247, 0.55),
        inset 0 1px 1px rgba(255, 255, 255, 0.45);
      transform: translateY(-2px) scale(1.03);
      color: #ffffff;
    }

    .enter-btn:hover .arrow-icon {
      transform: translateX(4px);
    }

    .enter-btn:active {
      transform: translateY(1px) scale(0.98);
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="container">
    <div class="network-badge">
      <span class="dot"></span>
      <span>Cronos Network // System Ready</span>
    </div>

    <!-- Canvas with responsive aspect ratio -->
    <div class="canvas-box">
      <canvas id="cursiveCanvas"></canvas>
    </div>

    <div class="btn-container" id="btnContainer">
      <button class="enter-btn" id="enterBtn" onclick="handleEnter()">
        <span>Click to Enter</span>
        <span class="arrow-icon">→</span>
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('cursiveCanvas');
    const ctx = canvas.getContext('2d');
    const box = document.querySelector('.canvas-box');
    const btnContainer = document.getElementById('btnContainer');

    let logicalWidth = 1000;
    let logicalHeight = 300;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = box.getBoundingClientRect();
      
      logicalWidth = rect.width;
      logicalHeight = rect.height;

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;

      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Preload typography
    Promise.all([
      document.fonts.load("italic 110px 'Italianno'"),
      document.fonts.load("800 70px 'Plus Jakarta Sans'")
    ]).then(() => {
      runAnimation();
    }).catch(() => {
      runAnimation();
    });

    // Helper: Draws a classic metallic fountain pen nib at (x, y)
    function drawFountainPenNib(ctx, x, y, angle, scale, opacity = 1) {
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(scale, scale);

      // 1. Nib shadow on canvas
      ctx.beginPath();
      ctx.ellipse(3, 4, 10, 4, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
      ctx.fill();

      // 2. Upper Pen Barrel Grip (Dark Matte Chrome)
      ctx.beginPath();
      ctx.moveTo(-16, -110);
      ctx.lineTo(16, -110);
      ctx.lineTo(13, -75);
      ctx.lineTo(-13, -75);
      ctx.closePath();
      const gripGrad = ctx.createLinearGradient(-16, 0, 16, 0);
      gripGrad.addColorStop(0, "#1c1917");
      gripGrad.addColorStop(0.5, "#44403c");
      gripGrad.addColorStop(1, "#1c1917");
      ctx.fillStyle = gripGrad;
      ctx.fill();

      // 3. Gold Trim Ring / Collar
      ctx.beginPath();
      ctx.rect(-13.5, -75, 27, 8);
      const ringGrad = ctx.createLinearGradient(-13, 0, 13, 0);
      ringGrad.addColorStop(0, "#b45309");
      ringGrad.addColorStop(0.3, "#fde047");
      ringGrad.addColorStop(0.7, "#fbbf24");
      ringGrad.addColorStop(1, "#78350f");
      ctx.fillStyle = ringGrad;
      ctx.fill();

      // 4. Vintage Steel & Gold Nib Body (Curved Diamond Silhouette)
      ctx.beginPath();
      ctx.moveTo(0, 0); // Nib tip
      ctx.bezierCurveTo(-5, -20, -14, -38, -12, -67);
      ctx.lineTo(12, -67);
      ctx.bezierCurveTo(14, -38, 5, -20, 0, 0);
      ctx.closePath();

      const nibGrad = ctx.createLinearGradient(-14, 0, 14, 0);
      nibGrad.addColorStop(0, "#cbd5e1");
      nibGrad.addColorStop(0.2, "#f8fafc");
      nibGrad.addColorStop(0.48, "#e2e8f0");
      nibGrad.addColorStop(0.52, "#94a3b8");
      nibGrad.addColorStop(0.8, "#f1f5f9");
      nibGrad.addColorStop(1, "#64748b");
      ctx.fillStyle = nibGrad;
      ctx.fill();

      // 5. Classic Gold Filigree Inlay on Nib Face
      ctx.beginPath();
      ctx.moveTo(0, -6);
      ctx.bezierCurveTo(-3, -22, -8, -36, -7, -56);
      ctx.lineTo(7, -56);
      ctx.bezierCurveTo(8, -36, 3, -22, 0, -6);
      ctx.closePath();
      const inlayGrad = ctx.createLinearGradient(-8, 0, 8, 0);
      inlayGrad.addColorStop(0, "#d97706");
      inlayGrad.addColorStop(0.5, "#fef08a");
      inlayGrad.addColorStop(1, "#b45309");
      ctx.fillStyle = inlayGrad;
      ctx.fill();

      // 6. Center Ink Slit Line & Heart Breather Hole
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -38);
      ctx.strokeStyle = "#09090b";
      ctx.lineWidth = 1;
      ctx.stroke();

      // Breather Hole
      ctx.beginPath();
      ctx.arc(0, -38, 2.2, 0, Math.PI * 2);
      ctx.fillStyle = "#0c0a09";
      ctx.fill();

      // 7. Fresh Wet Ink Glistening at the Tip (Violet Glow)
      ctx.beginPath();
      ctx.arc(0, 0, 2, 0, Math.PI * 2);
      ctx.fillStyle = "#e9d5ff";
      ctx.shadowColor = "#a855f7";
      ctx.shadowBlur = 8;
      ctx.fill();

      ctx.restore();
    }

    function runAnimation() {
      const part1 = "welcome to";
      const part2 = "CAVE";

      const time1 = 1400; // time to write "welcome to"
      const time2 = 1100; // time to write "CAVE"
      const liftTime = 350; // pen liftoff transition
      const totalTime = time1 + time2;
      const startTime = performance.now();

      function frame(now) {
        const elapsed = now - startTime;
        const progressTotal = Math.min(elapsed / totalTime, 1);

        ctx.clearRect(0, 0, logicalWidth, logicalHeight);

        // Responsive font scaling
        const scale = Math.min(logicalWidth / 750, 1.2);
        const font1Size = Math.max(54, Math.round(96 * scale));
        const font2Size = Math.max(34, Math.round(62 * scale));
        const letterSpacingCave = 14 * scale;

        // Measures
        ctx.font = `italic 400 ${font1Size}px 'Italianno', cursive`;
        const width1 = ctx.measureText(part1 + " ").width;

        ctx.font = `800 ${font2Size}px 'Plus Jakarta Sans', sans-serif`;
        let width2 = 0;
        for (let char of part2) {
          width2 += ctx.measureText(char).width + letterSpacingCave;
        }

        const totalWidth = width1 + width2;
        const startX = (logicalWidth - totalWidth) / 2;
        const baselineY = logicalHeight / 2 + (font1Size * 0.18);

        // 1. Draw "welcome to "
        const p1 = Math.min(elapsed / time1, 1);
        if (p1 > 0) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(startX - 10, 0, (width1 + 10) * p1, logicalHeight);
          ctx.clip();

          ctx.font = `italic 400 ${font1Size}px 'Italianno', cursive`;
          ctx.textBaseline = "alphabetic";

          ctx.shadowColor = "rgba(168, 85, 247, 0.3)";
          ctx.shadowBlur = 10;

          ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
          ctx.lineWidth = 1.5;
          ctx.strokeText(part1, startX, baselineY);

          ctx.fillStyle = "#e2e8f0";
          ctx.fillText(part1, startX, baselineY);
          ctx.restore();
        }

        // 2. Draw "CAVE"
        if (elapsed > time1) {
          const p2 = Math.min((elapsed - time1) / time2, 1);
          const caveX = startX + width1;

          ctx.save();
          ctx.beginPath();
          ctx.rect(caveX - 5, 0, (width2 + 25) * p2, logicalHeight);
          ctx.clip();

          ctx.font = `800 ${font2Size}px 'Plus Jakarta Sans', sans-serif`;
          ctx.textBaseline = "alphabetic";

          ctx.shadowColor = "#c084fc";
          ctx.shadowBlur = 24;

          let curX = caveX;
          for (let char of part2) {
            ctx.strokeStyle = "#a855f7";
            ctx.lineWidth = Math.max(3, 4 * scale);
            ctx.strokeText(char, curX, baselineY - (font1Size * 0.08));

            const grad = ctx.createLinearGradient(curX, baselineY - font2Size, curX, baselineY);
            grad.addColorStop(0, "#ffffff");
            grad.addColorStop(0.6, "#f5f3ff");
            grad.addColorStop(1, "#c084fc");
            ctx.fillStyle = grad;
            ctx.fillText(char, curX, baselineY - (font1Size * 0.08));

            curX += ctx.measureText(char).width + letterSpacingCave;
          }

          ctx.restore();
        }

        // 3. Draw & Animate Vintage Fountain Pen Nib
        let penX, penY, penAngle = 0.42; // ~24 degree natural handwriting slant
        let penOpacity = 1;

        if (elapsed <= totalTime) {
          if (elapsed <= time1) {
            // Flowing along "welcome to"
            penX = startX + width1 * p1;
            penY = baselineY - (font1Size * 0.12) + Math.sin(p1 * 24) * (8 * scale);
            penAngle += Math.cos(p1 * 24) * 0.08;
          } else {
            // Typing/Stroking across "CAVE"
            const p2 = (elapsed - time1) / time2;
            penX = startX + width1 + width2 * p2;
            penY = baselineY - (font2Size * 0.38) + Math.sin(p2 * 20) * (6 * scale);
            penAngle += Math.cos(p2 * 20) * 0.06;
          }

          drawFountainPenNib(ctx, penX, penY, penAngle, scale * 1.15, penOpacity);
        } else if (elapsed <= totalTime + liftTime) {
          // Pen lifts up from the page and fades away
          const liftProgress = (elapsed - totalTime) / liftTime;
          penX = startX + width1 + width2 + (liftProgress * 15 * scale);
          penY = baselineY - (font2Size * 0.38) - (liftProgress * 28 * scale);
          penAngle = 0.42 - (liftProgress * 0.15);
          penOpacity = 1 - liftProgress;

          drawFountainPenNib(ctx, penX, penY, penAngle, scale * 1.15, penOpacity);
        }

        if (elapsed <= totalTime + liftTime) {
          requestAnimationFrame(frame);
        } else {
          // Reveal the enter button once pen has fully lifted
          btnContainer.classList.add('show');
        }
      }

      requestAnimationFrame(frame);
    }

    function handleEnter() {
      const btn = document.getElementById('enterBtn');
      btn.innerHTML = '<span>Entering Terminal</span> <span class="arrow-icon">✓</span>';
      btn.style.borderColor = '#22c55e';
      btn.style.boxShadow = '0 0 35px rgba(34, 197, 94, 0.65)';
      btn.style.pointerEvents = 'none';

      setTimeout(() => {
        document.body.style.opacity = '0';
        document.body.style.filter = 'blur(4px)';
        setTimeout(() => {
          window.location.href = 'main.html';
        }, 220);
      }, 260);
    }
  </script>
</body>
</html>
