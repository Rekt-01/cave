<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>welcome to cave</title>

  <!-- High-end luxury calligraphy & sans fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Inter:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #030305;
      --accent: #a855f7;
      --accent-bright: #c084fc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: #ffffff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
      transition: opacity 0.35s ease, filter 0.35s ease;
      position: relative;
    }

    /* Subtle ambient dark violet glow */
    .ambient-glow {
      position: absolute;
      width: min(85vw, 600px);
      height: min(60vw, 360px);
      background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, rgba(3, 3, 5, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 900px;
      padding: 20px;
    }

    /* Handwriting Canvas */
    #caveCanvas {
      width: 100%;
      max-width: 820px;
      height: auto;
      max-height: 220px;
      display: block;
      filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.3));
    }

    /* Clean enter button container */
    .btn-wrap {
      margin-top: clamp(24px, 5vh, 44px);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .btn-wrap.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* Minimalist luxury button */
    .enter-btn {
      background: #09090e;
      color: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: clamp(12px, 2.8vw, 15px) clamp(30px, 6vw, 46px);
      font-size: clamp(0.85rem, 2.2vw, 0.98rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      outline: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      transition: all 0.22s ease;
    }

    .enter-btn:hover {
      border-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 0 28px rgba(168, 85, 247, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      transform: translateY(-2px) scale(1.02);
    }

    .enter-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .enter-btn svg {
      width: 14px;
      height: 14px;
      stroke: var(--accent-bright);
      stroke-width: 2.5;
      fill: none;
      transition: transform 0.2s ease;
    }

    .enter-btn:hover svg {
      transform: translateX(3px);
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="stage">
    <!-- Smooth high-res stroke canvas -->
    <canvas id="caveCanvas" width="1600" height="280"></canvas>

    <!-- Clean CTA button -->
    <div class="btn-wrap" id="btnWrap">
      <button class="enter-btn" id="enterBtn" onclick="handleEnter()">
        <span>Enter Cave</span>
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('caveCanvas');
    const ctx = canvas.getContext('2d');
    const btnWrap = document.getElementById('btnWrap');

    // High DPI Retina Support
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = 1600 * dpr;
    canvas.height = 280 * dpr;
    ctx.scale(dpr, dpr);

    // Load custom signature font
    document.fonts.load("italic 120px 'Alex Brush'").then(() => {
      runPen();
    }).catch(() => {
      runPen();
    });

    function runPen() {
      const phrasePrefix = "welcome to ";
      const phraseCave = "Cave";

      // Typographic measurements
      ctx.font = "italic 400 108px 'Alex Brush', cursive";
      const widthPrefix = ctx.measureText(phrasePrefix).width;

      ctx.font = "italic 700 128px 'Alex Brush', cursive";
      const widthCave = ctx.measureText(phraseCave).width;

      const totalWidth = widthPrefix + widthCave;
      const startX = (1600 - totalWidth) / 2;
      const baselineY = 175;

      const time1 = 1200; // time to write "welcome to "
      const time2 = 1000; // time to write "Cave"
      const totalTime = time1 + time2;
      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const progressTotal = Math.min(elapsed / totalTime, 1);

        ctx.clearRect(0, 0, 1600, 280);

        // 1. Write "welcome to " in refined silver cursive
        const p1 = Math.min(elapsed / time1, 1);
        if (p1 > 0) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(startX - 10, 0, (widthPrefix + 20) * p1, 280);
          ctx.clip();

          ctx.font = "italic 400 108px 'Alex Brush', cursive";
          ctx.textBaseline = "alphabetic";

          // Delicate ink stroke
          ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
          ctx.lineWidth = 1.5;
          ctx.strokeText(phrasePrefix, startX, baselineY);

          ctx.fillStyle = "rgba(226, 232, 240, 0.9)";
          ctx.fillText(phrasePrefix, startX, baselineY);
          ctx.restore();
        }

        // 2. Write "Cave" in bold illuminated calligraphy
        if (elapsed > time1) {
          const p2 = Math.min((elapsed - time1) / time2, 1);
          const caveX = startX + widthPrefix;

          ctx.save();
          ctx.beginPath();
          ctx.rect(caveX - 10, 0, (widthCave + 30) * p2, 280);
          ctx.clip();

          ctx.font = "italic 700 128px 'Alex Brush', cursive";
          ctx.textBaseline = "alphabetic";

          // Signature Glow
          ctx.shadowColor = "#c084fc";
          ctx.shadowBlur = 22;

          // Rich calligraphic strokes
          ctx.strokeStyle = "#a855f7";
          ctx.lineWidth = 5;
          ctx.strokeText(phraseCave, caveX, baselineY);

          ctx.strokeStyle = "#f3e8ff";
          ctx.lineWidth = 2;
          ctx.strokeText(phraseCave, caveX, baselineY);

          // Platinum silver to violet gradient
          const grad = ctx.createLinearGradient(caveX, baselineY - 80, caveX, baselineY);
          grad.addColorStop(0, "#ffffff");
          grad.addColorStop(1, "#e9d5ff");
          ctx.fillStyle = grad;
          ctx.fillText(phraseCave, caveX, baselineY);

          ctx.restore();
        }

        // 3. Glowing pen tip spark
        if (progressTotal < 1) {
          let penX, penY;

          if (elapsed <= time1) {
            penX = startX + widthPrefix * p1;
            penY = baselineY - 14 + Math.sin(p1 * 20) * 12;
          } else {
            const p2 = (elapsed - time1) / time2;
            penX = startX + widthPrefix + widthCave * p2;
            penY = baselineY - 18 + Math.sin(p2 * 18) * 16;
          }

          ctx.save();
          ctx.beginPath();
          ctx.arc(penX, penY, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "#a855f7";
          ctx.shadowBlur = 12;
          ctx.fill();
          ctx.restore();
        }

        if (progressTotal < 1) {
          requestAnimationFrame(step);
        } else {
          // Reveal the sleek button
          btnWrap.classList.add('show');
        }
      }

      requestAnimationFrame(step);
    }

    function handleEnter() {
      const btn = document.getElementById('enterBtn');
      btn.innerHTML = '<span>Entering...</span>';
      btn.style.borderColor = '#22c55e';
      btn.style.boxShadow = '0 0 28px rgba(34, 197, 94, 0.6)';
      btn.style.pointerEvents = 'none';

      setTimeout(() => {
        document.body.style.opacity = '0';
        document.body.style.filter = 'blur(4px)';
        setTimeout(() => {
          window.location.href = 'main.html';
        }, 200);
      }, 250);
    }
  </script>
</body>
</html>
