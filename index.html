<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTISAUR | App</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        neon: {
                            green: '#39ff14',
                            cyan: '#00f0ff',
                        },
                        background: {
                            dark: '#02040a',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh; /* Fallback */
            height: 100dvh; /* Better mobile handling */
            overflow: hidden; /* STRICTLY NO SCROLLING */
            background-color: #02040a;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        .starry-bg {
            background-color: #02040a;
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 160px 120px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 250px 90px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 300px 180px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
        }

        .float-anim {
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 25px rgba(57, 255, 20, 0.4));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        /* Bottom sheet auto slide up */
        .bottom-sheet {
            transform: translateY(100%);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
            background: linear-gradient(180deg, rgba(15, 20, 25, 0.98) 0%, rgba(5, 10, 15, 1) 100%);
            border-top: 1px solid rgba(57, 255, 20, 0.2);
            box-shadow: 0 -15px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        @keyframes slideUp {
            to { transform: translateY(0); }
        }

        .office-bg {
            background-image: url('232228162.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>

    <div id="page1" class="w-full h-full flex flex-col relative starry-bg overflow-hidden">
        
        <!-- Header Section -->
        <div class="absolute top-0 left-0 w-full pt-8 px-6 text-center z-20 flex flex-col items-center">
            <div class="flex justify-center items-center space-x-2 opacity-80 mb-2">
                <span class="text-gray-400 text-xs font-medium uppercase tracking-wider">Powered by</span>
                <div class="flex items-center space-x-1 font-bold text-white tracking-widest text-sm">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                    <span>CRONOS</span>
                </div>
            </div>
            
            <h1 class="font-display text-5xl md:text-6xl tracking-tighter text-neon-green" style="text-shadow: 0 0 15px rgba(57, 255, 20, 0.8), 0 0 30px rgba(57, 255, 20, 0.4);">
                ULTISAUR
            </h1>
            
            <div class="inline-flex items-center justify-center mt-3 px-5 py-1.5 rounded-full border border-neon-green/80 bg-neon-green/10 text-neon-green font-mono font-bold tracking-[0.2em] text-sm shadow-[0_0_20px_rgba(57,255,20,0.4)] backdrop-blur-md">
                $SAUR
            </div>
        </div>

        <!-- Center Image Section -->
        <!-- pb-[320px] perfectly offsets the fixed height of the bottom sheet below it -->
        <div class="flex-1 w-full relative z-10 flex flex-col justify-end pb-[340px]">
            <img 
                src="IMG_5639.png" 
                alt="Ultisaur Mascot" 
                class="float-anim"
                style="height: 60vh; max-height: 600px; width: 100%; object-fit: contain; object-position: bottom;"
            >
        </div>

        <!-- Bottom Sheet (Fixed absolute bottom) -->
        <div class="bottom-sheet absolute bottom-0 left-0 w-full h-[340px] rounded-t-3xl pt-5 pb-8 px-6 z-30 flex flex-col">
            
            <div class="w-12 h-1 bg-white/20 rounded-full mx-auto mb-6 shrink-0"></div>
            
            <div class="w-full max-w-sm mx-auto space-y-3.5 flex-1 flex flex-col">
                
                <!-- Join Discord (Bright Green) -->
                <a href="https://discord.gg/XvSqECzYv" target="_blank" rel="noopener noreferrer" 
                   class="w-full bg-neon-green text-black font-extrabold py-4 rounded-xl text-lg text-center tracking-wide shadow-[0_0_15px_rgba(57,255,20,0.4)] transition-transform active:scale-95 block">
                    Join the Horde
                </a>
                
                <!-- Connect Wallet (Black with Neon Border) -->
                <button class="w-full bg-black border-[2px] border-neon-green text-neon-green font-bold py-3.5 rounded-xl text-lg flex items-center justify-center space-x-2 transition-transform active:scale-95 shadow-[0_0_15px_rgba(57,255,20,0.15)]">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path>
                        <path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path>
                        <path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path>
                    </svg>
                    <span>Connect Wallet</span>
                </button>

                <!-- Continue as Guest -->
                <button id="btnContinue" class="w-full bg-transparent text-gray-300 py-3 rounded-xl text-base font-semibold hover:text-white transition-colors">
                    Continue as guest
                </button>

                <!-- Terms & Privacy (Tiny text) -->
                <div class="text-center text-[11px] text-gray-500 mt-auto pt-2 leading-tight">
                    By signing up, you agree to our<br>
                    <a href="#" class="underline hover:text-gray-300 transition-colors">Terms of Service</a> and <a href="#" class="underline hover:text-gray-300 transition-colors">Privacy Policy</a>.
                </div>
            </div>
        </div>
    </div>

    <div id="page2" class="w-full h-full relative office-bg" style="display: none;">
        
        <div class="absolute inset-0 bg-black/60 backdrop-blur-[2px]"></div>

        <div class="relative z-10 w-full h-full flex flex-col items-center justify-center p-6">
            
            <div class="text-center mb-10">
                <h2 class="font-display text-4xl md:text-5xl text-white drop-shadow-xl mb-3">CRONOS TERMINAL</h2>
                <p class="text-neon-cyan font-mono text-sm md:text-base tracking-widest bg-black/40 py-1.5 px-4 rounded-full border border-neon-cyan/30 inline-block">SECURE CONNECTION ESTABLISHED</p>
            </div>

            <!-- Open DEX Button -->
            <button id="btnOpenDex" class="bg-black/70 backdrop-blur-md border-2 border-neon-green shadow-[0_0_20px_rgba(57,255,20,0.3)] hover:shadow-[0_0_30px_rgba(57,255,20,0.6)] hover:bg-neon-green/10 text-neon-green font-bold text-xl py-6 px-10 rounded-2xl flex items-center space-x-3 uppercase tracking-widest transition-all active:scale-95">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
                <span>View Cronos DEX</span>
            </button>

            <!-- Back Utility -->
            <button id="btnBackToStart" class="absolute bottom-10 text-gray-400 text-sm hover:text-white transition-colors underline underline-offset-4 font-medium tracking-wide">
                Return to Login
            </button>
        </div>
    </div>

    <div id="dexModal" class="fixed inset-0 z-50 bg-[#0a0a0a] flex-col" style="display: none;">
        
        <!-- Mac-style Modal Header -->
        <div class="w-full h-12 bg-[#1a1a1a] border-b border-white/10 flex justify-between items-center px-4 shrink-0">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-[#ff5f56] border border-[#e0443e]"></div>
                <div class="w-3 h-3 rounded-full bg-[#ffbd2e] border border-[#dea123]"></div>
                <div class="w-3 h-3 rounded-full bg-[#27c93f] border border-[#1aab29]"></div>
                <span class="ml-4 font-mono text-gray-400 text-xs md:text-sm tracking-widest uppercase">DEX_SCREENER_MODULE</span>
            </div>
            
            <!-- Close Button -->
            <button id="btnCloseDex" class="text-gray-400 hover:text-white p-1.5 rounded hover:bg-white/10 transition-colors">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Verified Working DEX Iframe -->
        <div class="w-full flex-1 relative bg-[#0a0a0a]">
            <iframe 
                src="https://dexscreener.com/cronos/0xc90d1f7e3eb6ce335ce82a871bc20164cda27015?embed=1&theme=dark" 
                style="width:100%; height:100%; border:none;"
                title="Cronos DEX Screener">
            </iframe>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const dexModal = document.getElementById('dexModal');
            
            const btnContinue = document.getElementById('btnContinue');
            const btnOpenDex = document.getElementById('btnOpenDex');
            const btnCloseDex = document.getElementById('btnCloseDex');
            const btnBackToStart = document.getElementById('btnBackToStart');

            // Switch to View 2
            btnContinue.addEventListener('click', () => {
                page1.style.display = 'none';
                page2.style.display = 'block';
            });

            // Switch back to View 1
            btnBackToStart.addEventListener('click', () => {
                page2.style.display = 'none';
                page1.style.display = 'flex'; // Restore flex column layout
            });

            // Open Fullscreen DEX Modal
            btnOpenDex.addEventListener('click', () => {
                dexModal.style.display = 'flex'; // Use flex to maintain header + iframe stack
            });

            // Close DEX Modal
            btnCloseDex.addEventListener('click', () => {
                dexModal.style.display = 'none';
            });
            
        });
    </script>
</body>
</html>
