<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTISAUR | App</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        neon: {
                            green: '#39ff14',
                            cyan: '#00f0ff',
                        },
                        panel: {
                            dark: '#0a0d14',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            /* Use dvh for perfect mobile viewport sizing, avoiding browser chrome issues */
            height: 100dvh; 
            overflow: hidden; /* Strictly no scrolling */
            background-color: #050505;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        /* --- Page 1: Starry Background --- */
        .starry-bg {
            background-color: #050505;
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 160px 120px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 250px 90px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 300px 180px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
        }

        /* --- Mascot Floating Animation --- */
        .float-anim {
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 25px rgba(57, 255, 20, 0.4));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        /* --- Bottom Sheet Auto Slide-Up --- */
        /* It starts at 100% (offscreen down) and slides to 0 (its natural position) */
        .bottom-sheet {
            transform: translateY(100%);
            animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
            background: linear-gradient(180deg, rgba(15, 20, 25, 0.98) 0%, rgba(5, 10, 15, 1) 100%);
            border-top: 1px solid rgba(57, 255, 20, 0.2);
            box-shadow: 0 -15px 40px rgba(0,0,0,0.8);
        }

        @keyframes slideUp {
            to { transform: translateY(0); }
        }

        /* --- Page 2: Specific Background --- */
        .office-bg {
            background-image: url('232228162.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* --- Utility & Glassmorphism --- */
        .glass-btn {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid #39ff14;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
            transition: all 0.2s ease;
        }
        .glass-btn:hover {
            background: rgba(57, 255, 20, 0.1);
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.5);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <!-- We use flex-col. The top takes remaining space (flex-1), bottom is fixed height. -->
    <div id="page1" class="w-full h-full flex flex-col relative starry-bg overflow-hidden">
        
        <!-- Top Area (Header + Image) - Flex-1 ensures it only takes available space minus bottom panel -->
        <div class="flex-1 flex flex-col min-h-0 relative z-10 w-full max-w-lg mx-auto">
            
            <!-- Powered by Cronos & Title -->
            <div class="w-full pt-8 px-6 text-center shrink-0">
                <div class="flex justify-center items-center space-x-2 opacity-80 mb-3">
                    <span class="text-gray-400 text-xs font-medium uppercase tracking-wider">Powered by</span>
                    <div class="flex items-center space-x-1.5 font-bold text-white tracking-widest text-sm">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                            <polyline points="2 17 12 22 22 17"></polyline>
                            <polyline points="2 12 12 17 22 12"></polyline>
                        </svg>
                        <span>CRONOS</span>
                    </div>
                </div>
                
                <!-- Solid Neon Green glowing text -->
                <h1 class="font-display text-5xl md:text-6xl tracking-tighter text-neon-green" style="text-shadow: 0 0 10px rgba(57, 255, 20, 0.6), 0 0 20px rgba(57, 255, 20, 0.4);">
                    ULTISAUR
                </h1>
                
                <!-- NEW: $SAUR Ticker Badge -->
                <div class="inline-flex items-center justify-center mt-3 px-5 py-1.5 rounded-full border border-neon-green/70 bg-neon-green/10 text-neon-green font-mono font-bold tracking-[0.2em] text-sm md:text-base shadow-[0_0_20px_rgba(57,255,20,0.4)] backdrop-blur-md">
                    $SAUR
                </div>
            </div>

            <!-- Central Floating Image Container -->
            <!-- min-h-0 is required here so the image can shrink properly in flexbox -->
            <div class="flex-1 flex items-center justify-center p-4 min-h-0">
                <img 
                    src="IMG_5639.png" 
                    alt="Ultisaur Mascot" 
                    class="float-anim max-h-full max-w-full object-contain"
                >
            </div>
        </div>

        <!-- Bottom Panel - Fixed Height Layout blocks this space from the image -->
        <div class="bottom-sheet shrink-0 w-full h-[360px] rounded-t-3xl pt-5 pb-8 px-6 z-20 flex flex-col relative">
            
            <!-- Absolute background glow effect behind the sheet -->
            <div class="absolute -top-10 left-1/2 -translate-x-1/2 w-3/4 h-20 bg-neon-green/10 blur-[30px] rounded-[100%] pointer-events-none"></div>

            <div class="w-12 h-1 bg-white/20 rounded-full mx-auto mb-6 shrink-0"></div>
            
            <div class="w-full max-w-sm mx-auto space-y-3.5 flex-1 flex flex-col justify-center">
                
                <!-- Join Discord (Gradient) -->
                <a href="https://discord.gg/XvSqECzYv" target="_blank" rel="noopener noreferrer" 
                   class="w-full bg-gradient-to-r from-neon-green to-neon-cyan text-black font-bold py-4 rounded-xl text-lg text-center tracking-wide shadow-[0_0_15px_rgba(57,255,20,0.3)] transition-transform active:scale-95">
                    Join the Horde
                </a>
                
                <!-- Connect Wallet (Black w/ Green Border) -->
                <button class="w-full bg-[#0a0a0a] border-[1.5px] border-neon-green text-neon-green font-semibold py-3.5 rounded-xl text-lg flex items-center justify-center space-x-2 transition-transform active:scale-95 shadow-[0_0_10px_rgba(57,255,20,0.15)]">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path>
                        <path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path>
                        <path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path>
                    </svg>
                    <span>Connect Wallet</span>
                </button>

                <!-- Continue as Guest -->
                <button id="btnContinue" class="w-full bg-[#111] border border-white/10 text-gray-300 py-3.5 rounded-xl text-base font-medium hover:bg-white/5 hover:text-white transition-all active:scale-95">
                    Continue as guest
                </button>

                <!-- Terms & Privacy -->
                <div class="text-center text-[10px] text-gray-500 mt-2 leading-tight opacity-80">
                    By signing up, you agree to our<br>
                    <a href="#" class="underline hover:text-gray-300 transition-colors">Terms of Service</a> and <a href="#" class="underline hover:text-gray-300 transition-colors">Privacy Policy</a>.
                </div>
            </div>
        </div>
    </div>

    <!-- Page 2 (Hidden Initially) -->
    <div id="page2" class="w-full h-full relative office-bg" style="display: none;">
        
        <div class="absolute inset-0 bg-black/50 backdrop-blur-[2px]"></div>

        <div class="relative z-10 w-full h-full flex flex-col items-center justify-center p-6">
            
            <div class="text-center mb-8">
                <h2 class="font-display text-4xl md:text-5xl text-white drop-shadow-xl mb-2">CRONOS TERMINAL</h2>
                <p class="text-neon-cyan font-mono text-sm tracking-widest">SECURE CONNECTION ESTABLISHED</p>
            </div>

            <!-- Open DEX Button -->
            <button id="btnOpenDex" class="glass-btn text-neon-green font-bold text-lg md:text-xl py-5 px-8 rounded-2xl flex items-center space-x-3 uppercase tracking-widest">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
                <span>View Cronos DEX</span>
            </button>

            <!-- Back Utility -->
            <button id="btnBackToStart" class="mt-8 text-gray-400 text-sm hover:text-white transition-colors underline underline-offset-4">
                Return to Login
            </button>
        </div>
    </div>

    <!-- DEX Screener Modal (Hidden Initially) -->
    <div id="dexModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex-col" style="display: none;">
        
        <!-- Modal Header -->
        <div class="w-full h-14 bg-[#111] border-b border-neon-green/30 flex justify-between items-center px-4 shrink-0">
            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 rounded-full bg-red-500"></span>
                <span class="w-3 h-3 rounded-full bg-yellow-500"></span>
                <span class="w-3 h-3 rounded-full bg-green-500"></span>
                <span class="ml-3 font-mono text-neon-green text-xs md:text-sm tracking-widest">DEX_SCREENER_MODULE</span>
            </div>
            
            <!-- Close Button -->
            <button id="btnCloseDex" class="text-gray-400 hover:text-white p-2 rounded bg-white/5 hover:bg-red-500/20 hover:text-red-500 transition-colors">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Valid DEX Iframe -->
        <div class="w-full flex-1 relative bg-black">
            <iframe 
                src="https://dexscreener.com/cronos/0x814041b31a89c93f0b2f5b610c1f20ef7ffeb4ee?embed=1&theme=dark&info=0" 
                style="width:100%; height:100%; border:none;"
                title="Cronos DEX Screener">
            </iframe>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const dexModal = document.getElementById('dexModal');
            
            const btnContinue = document.getElementById('btnContinue');
            const btnOpenDex = document.getElementById('btnOpenDex');
            const btnCloseDex = document.getElementById('btnCloseDex');
            const btnBackToStart = document.getElementById('btnBackToStart');

            // Switch to Page 2
            btnContinue.addEventListener('click', () => {
                page1.style.display = 'none';
                page2.style.display = 'block';
            });

            // Switch to Page 1
            btnBackToStart.addEventListener('click', () => {
                page2.style.display = 'none';
                page1.style.display = 'flex'; // Restore flex layout
            });

            // Open DEX Modal
            btnOpenDex.addEventListener('click', () => {
                dexModal.style.display = 'flex'; // Use flex to maintain header layout
            });

            // Close DEX Modal
            btnCloseDex.addEventListener('click', () => {
                dexModal.style.display = 'none';
            });
            
        });
    </script>
</body>
</html>
