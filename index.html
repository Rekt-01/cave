<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTISAUR | App</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        neon: {
                            green: '#39ff14',
                            cyan: '#00f0ff',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Strictly no scrolling */
            background-color: #050505;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        /* --- Page 1: Starry Background --- */
        .starry-bg {
            background-color: #02040a;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 160px 120px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        /* --- Mascot Floating Animation --- */
        .float-anim {
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(57, 255, 20, 0.4));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* --- Bottom Sheet Auto Slide-Up --- */
        .bottom-sheet {
            transform: translateY(100%); /* Start completely off-screen */
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards; /* 1 second delay, stays up */
            background: linear-gradient(180deg, rgba(15, 20, 25, 0.95) 0%, rgba(5, 10, 15, 1) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(57, 255, 20, 0.3);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
        }

        @keyframes slideUp {
            to { transform: translateY(0); }
        }

        /* --- Page 2: Specific Background --- */
        .office-bg {
            background-image: url('232228162.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* --- Utility & Glassmorphism --- */
        .glass-btn {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid #39ff14;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
            transition: all 0.2s ease;
        }
        .glass-btn:hover {
            background: rgba(57, 255, 20, 0.1);
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.5);
            transform: scale(1.02);
        }

        /* Primary Call to Action Button */
        .btn-neon {
            background: linear-gradient(90deg, #39ff14 0%, #00f0ff 100%);
            color: #000;
            font-weight: 800;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
            transition: all 0.2s ease;
        }
        .btn-neon:hover {
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.6);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div id="page1" class="w-full h-full relative starry-bg flex flex-col justify-between">
        
        <!-- Powered by Cronos -->
        <div class="absolute top-6 w-full flex justify-center items-center z-10 space-x-2 opacity-80">
            <span class="text-gray-400 text-sm font-medium">Powered by</span>
            <div class="flex items-center space-x-1.5 font-bold text-white tracking-widest text-sm">
                <!-- Simple Cronos geometric logo approximation -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                <span>CRONOS</span>
            </div>
        </div>

        <!-- Header Branding -->
        <div class="w-full pt-20 px-6 text-center z-10">
            <h1 class="font-display text-5xl tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-neon-green to-neon-cyan drop-shadow-[0_0_15px_rgba(57,255,20,0.5)]">
                ULTISAUR
            </h1>
        </div>

        <!-- Central Floating Image -->
        <div class="flex-1 flex items-center justify-center p-4 relative z-0">
            <img 
                src="IMG_5639.png" 
                alt="Ultisaur Mascot" 
                class="float-anim max-h-[45vh] max-w-[90vw] object-contain"
            >
        </div>

        <!-- Auto Slide-Up Bottom Panel -->
        <div class="bottom-sheet absolute bottom-0 left-0 w-full rounded-t-3xl pt-5 pb-8 px-6 z-20">
            <!-- iOS style drag handle indicator -->
            <div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mb-5"></div>
            
            <div class="max-w-md mx-auto space-y-3">
                <!-- Join Discord -->
                <a href="https://discord.gg/XvSqECzYv" target="_blank" rel="noopener noreferrer" class="btn-neon w-full flex items-center justify-center py-4 rounded-xl text-lg tracking-wide">
                    Join the Horde
                </a>
                
                <!-- Connect Wallet Button -->
                <button class="w-full glass-btn py-4 rounded-xl text-lg font-semibold text-neon-green flex items-center justify-center space-x-2">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path>
                        <path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path>
                        <path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path>
                    </svg>
                    <span>Connect Wallet</span>
                </button>

                <!-- Continue as Guest (Switches to Page 2) -->
                <button id="btnContinue" class="w-full bg-transparent border border-white/20 text-gray-300 py-4 rounded-xl text-lg font-semibold hover:bg-white/5 hover:text-white transition-colors">
                    Continue as guest
                </button>

                <!-- Terms & Privacy -->
                <div class="text-center text-[11px] text-gray-500 mt-4 leading-relaxed">
                    By signing up, you agree to our<br>
                    <a href="#" class="underline hover:text-gray-300 transition-colors">Terms of Service</a> and <a href="#" class="underline hover:text-gray-300 transition-colors">Privacy Policy</a>.
                </div>
            </div>
        </div>
    </div>

    <!-- Note: display is strictly set to 'none' initially -->
    <div id="page2" class="w-full h-full relative office-bg" style="display: none;">
        
        <!-- Dark overlay to ensure button readability over the image -->
        <div class="absolute inset-0 bg-black/40"></div>

        <div class="relative z-10 w-full h-full flex flex-col items-center justify-center p-6">
            
            <div class="text-center mb-8">
                <h2 class="font-display text-4xl text-white drop-shadow-lg mb-2">CRONOS TERMINAL</h2>
                <p class="text-neon-cyan font-mono text-sm">SECURE CONNECTION ESTABLISHED</p>
            </div>

            <!-- The specific button to open DEX -->
            <button id="btnOpenDex" class="glass-btn text-neon-green font-bold text-xl py-6 px-10 rounded-2xl flex items-center space-x-3 uppercase tracking-widest">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
                <span>View Cronos DEX</span>
            </button>

            <!-- Back to start (Optional utility) -->
            <button id="btnBackToStart" class="mt-8 text-gray-400 text-sm hover:text-white underline underline-offset-4">
                Return to Login
            </button>
        </div>
    </div>

    <div id="dexModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex-col" style="display: none;">
        
        <!-- Modal Header -->
        <div class="w-full h-16 bg-[#111] border-b border-neon-green/30 flex justify-between items-center px-4 shrink-0">
            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 rounded-full bg-red-500"></span>
                <span class="w-3 h-3 rounded-full bg-yellow-500"></span>
                <span class="w-3 h-3 rounded-full bg-green-500"></span>
                <span class="ml-3 font-mono text-neon-green text-sm tracking-widest">DEX_SCREENER_MODULE</span>
            </div>
            
            <!-- Close Button -->
            <button id="btnCloseDex" class="text-gray-400 hover:text-white p-2 rounded bg-white/5 hover:bg-red-500/20 hover:text-red-500 transition-colors">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Working DEX Iframe -->
        <!-- Note: DexScreener blocks full chain embedding. We've used CAW (a top Cronos meme) as the default loaded pair so it successfully displays. Replace the 0x2c6... address with your own pair address when ready! -->
        <div class="w-full flex-1 relative bg-black">
            <iframe 
                src="https://dexscreener.com/cronos/0x2c64dbfc5944122d259fb143c6b2ad6802e861d8?embed=1&theme=dark" 
                style="width:100%; height:100%; border:none;"
                title="Cronos DEX Screener">
            </iframe>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Get references to our views
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const dexModal = document.getElementById('dexModal');
            
            // Get references to buttons
            const btnContinue = document.getElementById('btnContinue');
            const btnOpenDex = document.getElementById('btnOpenDex');
            const btnCloseDex = document.getElementById('btnCloseDex');
            const btnBackToStart = document.getElementById('btnBackToStart');

            // Logic to switch to Page 2
            btnContinue.addEventListener('click', () => {
                // Strictly hide page 1
                page1.style.display = 'none';
                // Strictly show page 2
                page2.style.display = 'block';
            });

            // Logic to switch back to Page 1 (for better usability)
            btnBackToStart.addEventListener('click', () => {
                page2.style.display = 'none';
                page1.style.display = 'flex'; // Uses flex for the page1 layout
            });

            // Logic to Open DEX Modal
            btnOpenDex.addEventListener('click', () => {
                dexModal.style.display = 'flex'; // Uses flex to maintain header/iframe layout
            });

            // Logic to Close DEX Modal
            btnCloseDex.addEventListener('click', () => {
                dexModal.style.display = 'none';
            });
            
        });
    </script>
</body>
</html>
