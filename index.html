<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTISAUR | Enter the Horde</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            green: '#39ff14',
                            cyan: '#00f0ff',
                            dark: '#030a06',
                            glass: 'rgba(10, 20, 15, 0.65)'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base reset for app-like feel */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030a06;
            color: white;
            overscroll-behavior: none;
            touch-action: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Dynamic Glowing Background Orbs */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
            animation: drift 20s infinite alternate ease-in-out;
        }
        
        .orb-green {
            background: #39ff14;
            width: 50vw;
            height: 50vw;
            top: -10%;
            left: -10%;
        }

        .orb-cyan {
            background: #00f0ff;
            width: 45vw;
            height: 45vw;
            bottom: -5%;
            right: -10%;
            animation-delay: -5s;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(8vw, 8vh) scale(1.15); }
        }

        /* Cyber Grid Overlay */
        .cyber-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
            perspective: 500px;
            transform: scale(1.2);
            mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
        }

        /* Neon Stroke Text Effect */
        .text-stroke-neon {
            font-family: 'Montserrat', sans-serif;
            color: transparent;
            -webkit-text-stroke: 2px rgba(57, 255, 20, 0.3);
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
            letter-spacing: -0.01em;
            line-height: 0.8;
            opacity: 0.8;
        }

        /* Floating Mascot Animation */
        .float-mascot {
            animation: float 4.5s ease-in-out infinite;
            /* Drop shadow specifically makes transparent PNGs pop off the background */
            filter: drop-shadow(0 25px 35px rgba(0, 240, 255, 0.3)) drop-shadow(0 0 60px rgba(57, 255, 20, 0.15));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: linear-gradient(135deg, rgba(10, 20, 15, 0.8) 0%, rgba(5, 10, 7, 0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(57, 255, 20, 0.15);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
        }

        /* Neon Gradient Button */
        .btn-primary {
            background: linear-gradient(90deg, #00f0ff 0%, #39ff14 100%);
            color: #000;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.5);
            transform: translateY(-2px);
        }

        /* Glow Border Button */
        .btn-secondary {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #00f0ff;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.05);
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.2), 0 0 15px rgba(0, 240, 255, 0.2);
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-full relative selection:bg-brand-cyan selection:text-black">

    <!-- Animated Orbs -->
    <div class="ambient-orb orb-green"></div>
    <div class="ambient-orb orb-cyan"></div>
    
    <!-- Subtle Grid Overlay -->
    <div class="cyber-grid"></div>

    <header class="w-full flex justify-center items-center h-[12%] min-h-[70px] z-20 relative px-4 pt-4">
        <div class="flex items-center space-x-2 text-xs sm:text-sm font-medium tracking-widest uppercase">
            <span class="text-gray-400">Powered by</span>
            <div class="flex items-center space-x-2 bg-white/5 border border-white/10 rounded-full px-3 py-1.5 backdrop-blur-sm">
                <!-- Glowing Dot -->
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#0052FF] opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-[#0052FF] shadow-[0_0_8px_#0052FF]"></span>
                </span>
                <span class="text-white font-bold tracking-wider">CRONOS</span>
            </div>
        </div>
    </header>

    <main class="flex-1 w-full relative flex items-center justify-center z-10 overflow-hidden min-h-0">
        
        <!-- Giant Neon Stroke Background Text -->
        <div class="absolute inset-0 flex items-center justify-center z-0 pointer-events-none select-none overflow-hidden">
            <h1 class="text-stroke-neon font-black text-[22vw] md:text-[16vw] lg:text-[14rem] text-center whitespace-nowrap transform -translate-y-4 md:-translate-y-12">
                ULTISAUR
            </h1>
        </div>

        <!-- Floating Mascot Image -->
        <!-- The drop-shadow in CSS will automatically trace the edges of your transparent PNG -->
        <div class="relative z-10 h-full w-full flex items-center justify-center pb-[20vh] md:pb-[15vh]">
            <img 
                src="IMG_5639.png" 
                alt="Ultisaur Mascot" 
                class="float-mascot max-h-[55vh] md:max-h-[60vh] max-w-[85vw] object-contain"
                onerror="this.src='https://placehold.co/800x800/transparent/39ff14?text=Place+IMG_5639.png+Here'"
            >
        </div>
    </main>

    <footer class="w-full absolute bottom-0 left-0 z-30 glass-panel rounded-t-[2.5rem] pb-8 pt-8 px-6 sm:px-8 shadow-2xl">
        <!-- Subtle drag handle decorative element -->
        <div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mb-6"></div>

        <div class="max-w-md mx-auto flex flex-col space-y-4 w-full">
            
            <!-- Primary Action -->
            <button class="w-full btn-primary font-extrabold text-[17px] py-4 rounded-2xl active:scale-[0.98] flex items-center justify-center space-x-2">
                <span>Join the Horde</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
            
            <!-- Secondary Action: Connect Wallet -->
            <button class="w-full btn-secondary font-semibold text-[17px] py-4 rounded-2xl flex items-center justify-center space-x-2 active:scale-[0.98]">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
                    <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
                    <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
                </svg>
                <span>Connect Wallet</span>
            </button>
            
            <!-- Tertiary Action -->
            <button class="w-full bg-transparent font-medium text-[15px] text-gray-400 py-2 rounded-2xl hover:text-white active:scale-[0.98] transition-colors duration-200">
                Continue as guest
            </button>

            <!-- Legal Text -->
            <div class="pt-2 text-center">
                <p class="text-[11px] text-gray-500/80 leading-relaxed font-medium">
                    By connecting, you agree to the <br class="sm:hidden">
                    <a href="#" class="text-gray-400 hover:text-brand-cyan transition-colors">Terms of Service</a> & 
                    <a href="#" class="text-gray-400 hover:text-brand-cyan transition-colors">Privacy Policy</a>.
                </p>
            </div>
        </div>
    </footer>

</body>
</html>
