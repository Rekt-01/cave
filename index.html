<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>welcome to cave</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050508;
      color: #ffffff;
      min-height: 100vh;
      min-height: 100dvh; /* Dynamic viewport height for mobile browsers */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.3s ease;
      padding: 20px 16px;
    }

    /* Ambient glow that scales with screen size */
    .ambient-glow {
      position: absolute;
      width: min(85vw, 550px);
      height: min(60vw, 350px);
      background: radial-gradient(circle, rgba(147, 51, 234, 0.18) 0%, rgba(5, 5, 8, 0) 72%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 860px;
    }

    /* Responsive Cursive Canvas */
    #cursiveCanvas {
      width: 100%;
      height: auto;
      max-height: 220px;
      display: block;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.45))
              drop-shadow(0 0 22px rgba(168, 85, 247, 0.38));
    }

    /* Button Container */
    .btn-container {
      margin-top: clamp(24px, 6vh, 48px);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .btn-container.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* "Click to Enter" Button */
    .enter-btn {
      position: relative;
      background: linear-gradient(135deg, #18181b, #09090b);
      color: #fafafa;
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: clamp(12px, 3vw, 16px) clamp(28px, 6vw, 44px);
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 22px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.25);
      transition: all 0.22s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      user-select: none;
      outline: none;
    }

    .enter-btn:hover {
      border-color: #a855f7;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transform: scale(1.04);
      color: #ffffff;
    }

    .enter-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="container">
    <!-- Dynamic high-DPI canvas -->
    <canvas id="cursiveCanvas" width="1400" height="280"></canvas>

    <div class="btn-container" id="btnContainer">
      <button class="enter-btn" id="enterBtn" onclick="handleEnter()">
        Click to Enter
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('cursiveCanvas');
    const ctx = canvas.getContext('2d');
    const btnContainer = document.getElementById('btnContainer');

    // Font load safety with immediate fallback
    let fontLoaded = false;
    document.fonts.load("italic 120px 'Great Vibes'").then(() => {
      fontLoaded = true;
      runAnimation();
    }).catch(() => {
      runAnimation();
    });

    // Fallback timer if fonts take too long over mobile connections
    setTimeout(() => {
      if (!fontLoaded) runAnimation();
    }, 400);

    let animationStarted = false;

    function runAnimation() {
      if (animationStarted) return;
      animationStarted = true;

      const text = "welcome to cave";
      // Fast, snappy writing duration (1.8 seconds)
      const duration = 1800; 
      const startTime = performance.now();

      function draw(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Responsive font rendering for standard canvas coords
        ctx.font = "italic 118px 'Great Vibes', cursive, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const textX = canvas.width / 2;
        const textY = canvas.height / 2;
        const totalWidth = ctx.measureText(text).width;
        const startX = textX - (totalWidth / 2) - 20;

        // Clip revealing the writing smoothly from left to right
        ctx.save();
        ctx.beginPath();
        const currentDrawWidth = (totalWidth + 50) * progress;
        ctx.rect(startX, 0, currentDrawWidth, canvas.height);
        ctx.clip();

        // Stroke pen effect
        ctx.strokeStyle = "#e9d5ff";
        ctx.lineWidth = 3.2;
        ctx.strokeText(text, textX, textY);

        // Fill glow
        ctx.fillStyle = "#ffffff";
        ctx.fillText(text, textX, textY);

        ctx.restore();

        // Glowing pen nib point moving with current draw position
        if (progress < 1) {
          const penX = startX + currentDrawWidth;
          ctx.beginPath();
          ctx.arc(penX, textY + 10, 4.5, 0, Math.PI * 2);
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "#a855f7";
          ctx.shadowBlur = 12;
          ctx.fill();
        }

        if (progress < 1) {
          requestAnimationFrame(draw);
        } else {
          // Reveal the button immediately after writing completes
          btnContainer.classList.add('show');
        }
      }

      requestAnimationFrame(draw);
    }

    function handleEnter() {
      const btn = document.getElementById('enterBtn');
      btn.innerText = 'Entering... 🚀';
      btn.style.borderColor = '#22c55e';
      btn.style.boxShadow = '0 0 30px rgba(34, 197, 94, 0.7)';
      btn.style.pointerEvents = 'none';

      setTimeout(() => {
        document.body.style.opacity = '0';
        setTimeout(() => {
          window.location.href = 'main.html';
        }, 220);
      }, 250);
    }
  </script>
</body>
</html>
