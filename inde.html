<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>welcome to cave</title>
  
  <!-- Great Vibes handwriting font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050507;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.4s ease;
    }

    /* Subtle ambient glow in center */
    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 300px;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.15) 0%, rgba(5, 5, 7, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 900px;
    }

    /* SVG cursive writing container */
    .cursive-svg {
      width: 100%;
      max-width: 780px;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.45))
              drop-shadow(0 0 25px rgba(168, 85, 247, 0.4));
    }

    .cursive-text {
      font-family: 'Great Vibes', cursive;
      font-size: 82px;
      fill: transparent;
      stroke: #ffffff;
      stroke-width: 1.8px;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: writePen 4.2s cubic-bezier(0.4, 0, 0.2, 1) forwards,
                 fillIn 1.4s ease 3.4s forwards;
    }

    /* Pen writing animation */
    @keyframes writePen {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Fills the pen strokes with light once drawn */
    @keyframes fillIn {
      to {
        fill: #f5f3ff;
        stroke: #e9d5ff;
        stroke-width: 1px;
      }
    }

    /* Button wrapper */
    .btn-container {
      margin-top: 45px;
      opacity: 0;
      transform: translateY(18px);
      animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 4.2s forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Click to Ape Button */
    .ape-btn {
      position: relative;
      background: linear-gradient(135deg, #18181b, #09090b);
      color: #fafafa;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 16px 42px;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.25);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      user-select: none;
      outline: none;
      text-decoration: none;
    }

    .ape-btn:hover {
      border-color: #a855f7;
      box-shadow: 0 0 28px rgba(168, 85, 247, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transform: scale(1.05);
      color: #ffffff;
    }

    .ape-btn:active {
      transform: scale(0.97);
    }

    .ape-btn::after {
      content: '🦍';
      font-size: 1.25rem;
      transition: transform 0.2s ease;
    }

    .ape-btn:hover::after {
      transform: rotate(12deg) scale(1.15);
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="container">
    <!-- SVG cursive text -->
    <svg class="cursive-svg" viewBox="0 0 750 180" xmlns="http://www.w3.org/2000/svg">
      <text x="50%" y="65%" text-anchor="middle" class="cursive-text">
        welcome to cave
      </text>
    </svg>

    <!-- Click to Ape Button -->
    <div class="btn-container">
      <button class="ape-btn" id="apeButton" onclick="handleApe()">
        Click to Ape
      </button>
    </div>
  </div>

  <script>
    function handleApe() {
      const btn = document.getElementById('apeButton');
      btn.innerText = 'Aping In... 🚀';
      btn.style.borderColor = '#22c55e';
      btn.style.boxShadow = '0 0 35px rgba(34, 197, 94, 0.7)';
      btn.style.pointerEvents = 'none';

      // Brief pause to display the aped effect, then smoothly navigate to main.html
      setTimeout(() => {
        document.body.style.opacity = '0';
        setTimeout(() => {
          window.location.href = 'main.html';
        }, 300);
      }, 400);
    }
  </script>
</body>
</html>
